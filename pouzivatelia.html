<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa používateľov | WebLab</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="pouzivatelia.js" defer></script>
</head>
<body>
    <div id="topbar"></div>

    <main class="container">
        <h1>Správa používateľov</h1>
        <p class="lead">Zaregistrujte nového používateľa. Heslo sa do databázy uloží iba ako bcrypt hash.</p>

        <form id="registraciaForm" class="form-box">
            <div class="form-group">
                <label for="meno">Meno a priezvisko</label>
                <input id="meno" type="text" maxlength="100" placeholder="Meno a priezvisko" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" maxlength="150" placeholder="E-mail" required>
            </div>
            <div class="form-group">
                <label for="heslo">Heslo</label>
                <input id="heslo" type="password" minlength="6" placeholder="Heslo (min. 6 znakov)" required>
            </div>
            <button type="submit">Registrovať používateľa</button>
        </form>

        <p id="sprava" role="status" aria-live="polite"></p>

        <section class="card table-wrap" aria-labelledby="users-title">
            <h2 id="users-title">Zoznam zaregistrovaných používateľov</h2>
            <table class="data">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Meno</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Akcia</th>
                    </tr>
                </thead>
                <tbody id="zoznamPouzivatelov">
                    <tr><td colspan="4">Načítavam používateľov…</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <div class="footer">© 2026 WebLab · Databázy a internet</div>
</body>
</html>
